[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = --reuse-db
markers =
    integration: live LiteAPI calls (requires NUITEE_API_KEY)
    booking_flow: creates/confirms/cancels a sandbox booking (requires NUITEE_RUN_BOOKING_FLOW=1)
