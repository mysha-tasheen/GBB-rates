services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gbb_rates
      POSTGRES_USER: gbb
      POSTGRES_PASSWORD: gbb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbb -d gbb_rates"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: gbb_rates
      POSTGRES_USER: gbb
      POSTGRES_PASSWORD: gbb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
